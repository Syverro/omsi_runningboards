<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planner System & Duty Builder</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans flex flex-col antialiased">

  <!-- LOGIN MODAL -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-6">
      
      <div class="text-center space-y-2">
        <div class="inline-flex p-3 bg-blue-600/10 text-blue-500 rounded-xl mb-2">
          <i data-lucide="shield-check" class="w-8 h-8"></i>
        </div>
        <h1 class="text-xl font-bold text-white tracking-wide">Planner Access Portal</h1>
        <p class="text-xs text-slate-400">Enter matching username and password to log in.</p>
      </div>

      <!-- FORM WITH CASE-INSENSITIVE CHECK & PASSWORD TOGGLE -->
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Planner Username</label>
          <input type="text" id="login-user" required placeholder="e.g. planner1" class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition">
        </div>

        <div>
          <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Password</label>
          <div class="relative">
            <input type="password" id="login-pass" required placeholder="Must match username" class="w-full bg-slate-950 border border-slate-700 rounded-lg pl-3 pr-10 py-2 text-sm text-white focus:outline-none focus:border-blue-500 transition">
            <button type="button" onclick="togglePassVisibility()" class="absolute right-3 top-2.5 text-slate-400 hover:text-white" title="Toggle password visibility">
              <i data-lucide="eye" id="pass-toggle-icon" class="w-4 h-4"></i>
            </button>
          </div>
        </div>

        <div id="login-error" class="hidden text-xs text-rose-400 bg-rose-500/10 border border-rose-500/20 p-2.5 rounded-lg text-center font-medium">
          Invalid credentials. Password must match your username.
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-lg shadow-blue-600/20 flex items-center justify-center gap-2">
          <i data-lucide="log-in" class="w-4 h-4"></i>
          Access System
        </button>
      </form>

    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div id="app-container" class="hidden flex-col min-h-screen">
    <!-- Header Navbar -->
    <header class="bg-slate-900 border-b border-slate-800 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <i data-lucide="bus" class="w-6 h-6 text-blue-500"></i>
        <h1 class="text-lg font-bold text-white tracking-wide">Duty Builder & Operations</h1>
      </div>

      <div class="flex items-center gap-4 text-xs">
        <span id="paddle-planner-tag" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700 font-mono">Planner: ---</span>
        <div class="flex items-center gap-2 text-slate-400">
          <i data-lucide="user" class="w-4 h-4"></i>
          <span id="active-user-display" class="font-medium text-slate-200">---</span>
        </div>
        <button onclick="handleLogout()" class="bg-slate-800 hover:bg-rose-600/20 hover:text-rose-400 text-slate-300 p-2 rounded-lg transition border border-slate-700" title="Log Out">
          <i data-lucide="log-out" class="w-4 h-4"></i>
        </button>
      </div>
    </header>

    <!-- App Content Body -->
    <main class="flex-1 p-6 max-w-7xl w-full mx-auto space-y-6">
      <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex items-center justify-between">
        <div>
          <h2 class="text-xl font-bold text-white mb-1">Active Planning Workspace</h2>
          <p class="text-sm text-slate-400">System ready. Select routes, schedule duties, or export paddles.</p>
        </div>
        <div class="flex gap-3">
          <button class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2 rounded-lg text-sm font-medium border border-slate-700 transition flex items-center gap-2">
            <i data-lucide="refresh-cw" class="w-4 h-4"></i> Refresh Data
          </button>
          <button class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-lg shadow-blue-600/20 flex items-center gap-2">
            <i data-lucide="plus" class="w-4 h-4"></i> New Duty
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- SYSTEM JAVASCRIPT -->
  <script>
    let currentUser = null;

    // Check existing session on load
    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      const savedUser = localStorage.getItem('rb_planner_user');
      if (savedUser) {
        loginUser(savedUser);
      }
    });

    // Case-Insensitive Login Handler
    function handleLogin(e) {
      e.preventDefault();
      const rawUser = document.getElementById('login-user').value.trim();
      const rawPass = document.getElementById('login-pass').value.trim();

      const userClean = rawUser.toLowerCase();
      const passClean = rawPass.toLowerCase();
      const errBox = document.getElementById('login-error');

      // Case-insensitive validation check
      if (userClean && userClean === passClean) {
        errBox.classList.add('hidden');
        loginUser(rawUser);
      } else {
        errBox.classList.remove('hidden');
      }
    }

    // Authenticate and set interface
    function loginUser(username) {
      currentUser = username;
      localStorage.setItem('rb_planner_user', username);

      document.getElementById('login-modal').classList.add('hidden');
      document.getElementById('app-container').classList.remove('hidden');
      document.getElementById('app-container').classList.add('flex');

      document.getElementById('active-user-display').innerText = username;
      document.getElementById('paddle-planner-tag').innerText = `Planner: ${username}`;

      if (typeof refreshMapDropdowns === 'function') {
        refreshMapDropdowns();
      }
    }

    // Log Out
    function handleLogout() {
      localStorage.removeItem('rb_planner_user');
      currentUser = null;
      document.getElementById('app-container').classList.add('hidden');
      document.getElementById('app-container').classList.remove('flex');
      document.getElementById('login-modal').classList.remove('hidden');
      document.getElementById('login-form').reset();
    }

    // Password Visibility Toggle
    function togglePassVisibility() {
      const passInput = document.getElementById('login-pass');
      const icon = document.getElementById('pass-toggle-icon');

      if (passInput.type === 'password') {
        passInput.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        passInput.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }
  </script>
</body>
</html>
